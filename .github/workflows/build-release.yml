name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download Unity stubs from game
        run: |
          mkdir -p src/ParalivesMultiplayer/references
          # Download Paralives game data from SteamCMD or use pre-extracted stubs
          # For now, build without Unity refs — BepInEx.Unity.Mono provides the types
          echo "Building with BepInEx.Unity.Mono NuGet package only"

      - name: Build
        run: dotnet build src/ParalivesMultiplayer/ParalivesMultiplayer.csproj -c Release

      - name: Copy dependencies
        run: |
          mkdir -p artifact
          cp src/ParalivesMultiplayer/bin/Release/ParalivesMultiplayer.dll artifact/
          cp src/ParalivesMultiplayer.Protocol/bin/Release/ParalivesMultiplayer.Protocol.dll artifact/

      - name: Create archive
        run: tar czf ParalivesMultiplayer.zip -C artifact .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ParalivesMultiplayer.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
