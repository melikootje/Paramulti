name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download game DLLs via SteamCMD
        run: |
          # Install SteamCMD
          mkdir -p ~/steamcmd && cd ~/steamcmd
          wget -q https://cdn.cloudflare.steamstatic.com/steamcmd_linux.tar.gz
          tar -xzf steamcmd_linux.tar.gz
          ./steamcmd.sh +login anonymous +app_update 1465780 validate +quit

      - name: Extract Unity DLLs from game
        run: |
          GAME_DIR="$HOME/.local/share/Steam/steamapps/common/Paralives"
          if [ ! -d "$GAME_DIR" ]; then
            GAME_DIR="$HOME/steamcmd/Paralives"
          fi
          # Extract managed DLLs from game data
          mkdir -p src/ParalivesMultiplayer/references
          find "$GAME_DIR" -name "UnityEngine*.dll" -exec cp {} src/ParalivesMultiplayer/references/ \; 2>/dev/null || true
          find "$GAME_DIR" -name "0Harmony.dll" -exec cp {} src/ParalivesMultiplayer/references/ \; 2>/dev/null || true
          find "$GAME_DIR" -name "BepInEx.dll" -exec cp {} src/ParalivesMultiplayer/references/ \; 2>/dev/null || true

      - name: Build
        run: dotnet build src/ParalivesMultiplayer/ParalivesMultiplayer.csproj -c Release

      - name: Copy dependencies
        run: |
          mkdir -p artifact
          cp src/ParalivesMultiplayer/bin/Release/ParalivesMultiplayer.dll artifact/
          cp src/ParalivesMultiplayer.Protocol/bin/Release/ParalivesMultiplayer.Protocol.dll artifact/

      - name: Create archive
        run: tar czf ParalivesMultiplayer.zip -C artifact .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ParalivesMultiplayer.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
